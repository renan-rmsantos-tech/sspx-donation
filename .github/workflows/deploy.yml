name: Deploy (DigitalOcean)

# O GitHub Actions voltou a rodar neste repositório. O `git push production main`
# (README.md → Deploy) continua como alternativa; os dois usam o mesmo lock no
# servidor, então não rodam ao mesmo tempo.
#
# Deploy automático: a cada push na main, roda testes/lint e, se passarem,
# conecta via SSH na Droplet para reconstruir e subir o container.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Gate: lint precisa passar para o deploy prosseguir.
      - run: npm run lint

      # Gate: os testes precisam passar para o deploy prosseguir.
      - name: Testes
        run: npm test

  deploy:
    name: Deploy na Droplet
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy pelo ci-gate
        # A chave só aciona `deploy sspx-donation` no ci-gate do servidor (sem shell);
        # o passo a passo do deploy está em sspx-school/infra/ci-gate.
        env:
          SSH_KEY: ${{ secrets.CI_GATE_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.CI_GATE_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o ServerAliveInterval=30 \
            renan@64.225.15.219 "deploy sspx-donation"
